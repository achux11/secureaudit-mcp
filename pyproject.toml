[project]
name = "secureaudit-ai"
version = "0.1.0"
description = "SecureAudit AI — local financial audit MCP with PII scrubbing and privacy-gated webhooks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
]

[project.scripts]
secureaudit-mcp = "secureaudit.server:main"
secureaudit-demo = "secureaudit.demo:main"
secureaudit-ui = "secureaudit.webapp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["secureaudit"]

[tool.hatch.build.targets.wheel.force-include]
"secureaudit/static" = "secureaudit/static"
